<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 110" width="340" height="110" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Montserrat:wght@500;600&amp;display=swap');
      .brand-title { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 700; fill: #1B2E28; letter-spacing: 0.16em; }
      .brand-sub { font-family: 'Montserrat', sans-serif; font-size: 8.5px; font-weight: 600; fill: #B08D57; letter-spacing: 0.32em; }
      .brand-tag { font-family: 'Montserrat', sans-serif; font-size: 5.5px; font-weight: 500; fill: #70655E; letter-spacing: 0.22em; }
    </style>
  </defs>

  <!-- Símbolo: Bíblia Aberta com Cruz Central -->
  <g transform="translate(170, 26)">
    <!-- Cruz Central -->
    <path d="M0 -18 V2 M-6 -12 H6" stroke="#B08D57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Páginas Curvadas da Bíblia -->
    <path d="M-2 4 C-8 0 -18 1 -24 5 C-24 10 -16 8 -2 9 Z" fill="#B08D57" opacity="0.9"/>
    <path d="M2 4 C8 0 18 1 24 5 C24 10 16 8 2 9 Z" fill="#B08D57" opacity="0.9"/>
    <path d="M-2 10 C-8 6 -17 7 -23 11 C-23 13 -16 11 -2 12 Z" fill="#B08D57" opacity="0.6"/>
    <path d="M2 10 C8 6 17 7 23 11 C23 13 16 11 2 12 Z" fill="#B08D57" opacity="0.6"/>
  </g>

  <!-- Letreiro MANANCIAL -->
  <text x="170" y="66" text-anchor="middle" class="brand-title">MANANCIAL</text>

  <!-- Linha divisória e STORE -->
  <line x1="90" y1="78" x2="125" y2="78" stroke="#B08D57" stroke-width="0.8" opacity="0.6"/>
  <text x="170" y="81" text-anchor="middle" class="brand-sub">S T O R E</text>
  <line x1="215" y1="78" x2="250" y2="78" stroke="#B08D57" stroke-width="0.8" opacity="0.6"/>

  <!-- Tagline -->
  <text x="170" y="97" text-anchor="middle" class="brand-tag">MAIS QUE PRODUTOS, UM PROPÓSITO.</text>
</svg>
